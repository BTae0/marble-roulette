<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>마블 룰렛</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2338bdf8'/%3E%3Ccircle cx='12' cy='11' r='4' fill='%23fff' fill-opacity='.5'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-Dirpjy-z.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-p-qp70Pw.css">
  </head>
  <body>
    <main id="app">
      <section id="setup" class="screen">
        <header class="brand">
          <span class="dot" aria-hidden="true"></span>
          <div>
            <h1>마블 룰렛</h1>
            <p>구슬이 달리고, 운이 정합니다.</p>
          </div>
        </header>

        <div class="grid">
          <div class="card">
            <div class="card-head">
              <label for="nameInput">참가자</label>
              <span id="count" class="chip">0개</span>
            </div>
            <div class="add-row">
              <input id="nameInput" type="text" autocomplete="off" spellcheck="false" placeholder="이름 입력 후 Enter" />
              <button id="addBtn" class="btn add" type="button">추가</button>
            </div>
            <p class="hint">여러 명은 쉼표·줄바꿈으로 구분해 붙여넣을 수 있고, <b>이름*3</b>처럼 쓰면 3개가 추가됩니다.</p>
            <ul id="warnings" class="warnings" aria-live="polite"></ul>
            <ul id="roster" class="roster" aria-label="참가자 목록"></ul>
            <div class="tools">
              <span class="tools-label">번호로 추가</span>
              <button class="tool" type="button" data-n="5">5</button>
              <button class="tool" type="button" data-n="10">10</button>
              <button class="tool" type="button" data-n="20">20</button>
              <span class="spacer"></span>
              <button id="shuffle" class="tool" type="button">순서 섞기</button>
              <button id="clearAll" class="tool danger" type="button">모두 지우기</button>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><span class="label">맵</span></div>
            <div id="maps" class="maps" role="radiogroup" aria-label="맵 선택"></div>
            <p id="mapDesc" class="map-desc"></p>

            <div class="card-head spaced"><span class="label">당첨 방식</span></div>
            <div id="modes" class="seg" role="radiogroup" aria-label="당첨 방식">
              <button type="button" role="radio" data-mode="first">First<small>1등</small></button>
              <button type="button" role="radio" data-mode="last">Last<small>꼴찌</small></button>
              <button type="button" role="radio" data-mode="multiple">Multiple<small>상위 K명</small></button>
            </div>
            <label id="kWrap" class="k-wrap hidden">
              당첨 인원 K
              <input id="k" type="number" min="1" value="2" inputmode="numeric" />
            </label>

            <button id="start" class="btn primary" type="button" disabled>Start</button>
            <p class="note">물리 시뮬레이션 결과이므로 맵 형태에 따라 확률이 균등하지 않을 수 있습니다.</p>
          </div>
        </div>
      </section>

      <section id="race" class="screen hidden">
        <canvas id="stage" aria-label="구슬 경주 화면"></canvas>
        <div class="hud">
          <button id="back" class="btn ghost small" type="button">← 설정</button>
          <div class="hud-right">
            <button id="follow" class="btn ghost small" type="button">자동 추적 켜짐</button>
            <button id="speed" class="btn ghost small" type="button">1x</button>
            <button id="pause" class="btn ghost small" type="button">일시정지</button>
          </div>
        </div>
        <aside id="board" class="board" aria-label="실시간 순위"></aside>
      </section>

      <div id="result" class="overlay hidden" role="dialog" aria-modal="true" aria-label="결과">
        <canvas id="confetti"></canvas>
        <div class="result-card">
          <p class="kicker" id="resultKicker">당첨</p>
          <div id="winners" class="winners"></div>
          <details open>
            <summary>전체 순위</summary>
            <ol id="ranking" class="ranking"></ol>
          </details>
          <div class="actions">
            <button id="again" class="btn primary" type="button">같은 설정으로 다시</button>
            <button id="toSetup" class="btn ghost" type="button">설정으로</button>
            <button id="copy" class="btn ghost" type="button">결과 복사</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
